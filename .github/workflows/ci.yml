name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI에서는 git 훅을 설치할 필요가 없어 prepare 스크립트를 건너뛴다
  HUSKY: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      # 빌드 시 Supabase 클라이언트 생성에 URL·키가 필요하므로 더미 값을 넣는다 (실제 접속은 하지 않음)
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
